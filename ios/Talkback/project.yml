name: Talkback
options:
  bundleIdPrefix: com.dongseok
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Talkback:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Talkback
    info:
      path: Talkback/Info.plist
      properties:
        CFBundleDisplayName: Talkback
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "영어로 말하는 연습을 하려면 마이크가 필요해요."
        NSSpeechRecognitionUsageDescription: "내가 말한 영어와 한국어를 글자로 바꾸는 데 음성 인식을 사용해요."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongseok.talkback
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
